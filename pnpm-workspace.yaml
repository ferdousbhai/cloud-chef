packages:
  - 'cloudchef-agent'
  - 'template'
  - 'user-workspace-runtime'
ignoreWorkspaceRootCheck: true
# pnpm otherwise holds back releases younger than a day; CloudChef installs the latest.
minimumReleaseAge: 0
strictDepBuilds: true
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release; it reaches only build-time file watching and
    # globbing (eslint plugins, tailwind's chokidar), never a deployed Worker. Drop on release.
    - 'GHSA-vfj7-8cjw-p6xm'
    # sprintf-js <=1.1.3 has no patched release; it reaches only the printf builtin of agents'
    # just-bash shell emulation, which CloudChef doesn't import. Drop on release.
    - 'GHSA-hp3w-g68c-fv3c'
blockExoticSubdeps: true
overrides:
  # Keep every transitive range on the fully patched brace-expansion releases.
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  # minimatch fixed GHSA-g3hv-75wg-m249 only in 11; its API is unchanged for eslint's and knip's use.
  'minimatch@>=10.0.0 <11.0.1': '11.0.3'
  # Reviewed security releases accepted by the existing transitive ranges.
  '@hono/node-server@<2.1.3': '2.1.3'
  'browserslist@<=4.28.6': '4.28.8'
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'hono@<4.13.11': '4.13.11'
  'ip-address@<=10.7.3': '10.7.4'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'nanoid@<3.3.18': '3.3.18'
  'postcss@<=8.5.22': '8.5.25'
  'postcss-selector-parser@<7.1.6': '7.1.6'
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
  '@modelcontextprotocol/client@>=2.0.0 <2.2.0': '2.2.0'
  '@modelcontextprotocol/sdk@>=1.12.0 <1.32.1': '1.32.1'
  'qs@<6.16.1': '6.16.1'
  'smol-toml@<1.8.1': '1.9.1'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'zod@>=4.0.0 <4.6.6': '4.6.7'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  # Miniflare's affected pin is compatible with the patched sharp line used by
  # current Cloudflare tooling.
  'sharp@<0.35.5': '0.35.5'
allowBuilds:
  '@google/genai': false
  # Computer's shell emulation treats these native compression bindings as
  # optional. Keep their install scripts disabled in the Worker build.
  '@mongodb-js/zstd': false
  core-js-pure: true
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    # Type-only v5 is compatible with the currently published Agents packages.
    '@cloudflare/workers-types': '5'
    # @blitz/eslint-plugin is exercised by the repository's ESLint 9 validation.
    eslint: '9'
# Computer 0.8.0 still probes 100 blob hashes in one statement (Durable Object SQLite accepts fewer
# bind variables) and still issues raw SAVEPOINT for a nested transaction (a Durable Object refuses
# it). Remove each hunk when upstream fixes it.
patchedDependencies:
  '@cloudflare/computer@0.8.0': patches/@cloudflare__computer@0.8.0.patch
