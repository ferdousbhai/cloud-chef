name: Browser gate

# Cloudflare Workers Builds runs the release validation, but its build image has
# no supported way to install Chromium and its system libraries, so the
# credential-free browser gate runs here instead of in the deploy pipeline.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install the pinned toolchain
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:e2e:install
      - run: pnpm run verify:built-browser

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-gate-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
