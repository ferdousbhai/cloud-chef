name: Support request
description: Get product help, report abuse, or start an account or privacy request without sensitive details
title: '[Support]: '
labels:
  - support
assignees:
  - ferdousbhai
body:
  - type: markdown
    attributes:
      value: >-
        This issue is public. Do not include prompts, source code, Cloudflare account IDs, credentials, tokens,
        personal data, or vulnerability details. For an account or privacy request, include only the request type and
        your GitHub handle. If a private method can be arranged, a maintainer will identify it in the issue; until then,
        do not provide sensitive information. CloudChef aims to review and acknowledge reports within two weekdays,
        but this is not a guarantee or contractual service level. For immediate danger contact local emergency
        services. For a compromised Cloudflare account use
        https://developers.cloudflare.com/support/contacting-cloudflare-support/.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Product help
        - Cloudflare connection
        - Cloudflare billing boundary
        - Account or privacy request (request type only)
        - Abuse report (prohibited use of CloudChef)
        - Other non-sensitive question
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: How can we help?
      description: Describe the outcome you need using non-sensitive details.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, personal data, private project content, and Cloudflare account identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
