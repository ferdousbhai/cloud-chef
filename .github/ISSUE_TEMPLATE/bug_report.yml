name: Bug report
description: Report a reproducible problem in CloudChef
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities here. Follow SECURITY.md and use GitHub private vulnerability reporting instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what impact did it have?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps, with secrets and personal data removed.
      placeholder: |
        1. Open …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the CloudChef app version or commit, browser, operating system, and relevant Cloudflare context.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, private data, and other secrets from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
