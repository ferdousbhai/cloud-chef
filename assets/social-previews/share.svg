      <stop offset="0" stop-color="#164a35"/>
      <stop offset="0.48" stop-color="#0d171c"/>
      <stop offset="1" stop-color="#080d11"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
