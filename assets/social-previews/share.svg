    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="100" cy="550" r="260" fill="#38e07b" opacity=".04"/>
  <circle cx="1120" cy="70" r="210" fill="#38e07b" opacity=".055"/>

  <text x="72" y="103" fill="#38e07b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing=".8">cloudchef.build</text>
  <text x="72" y="255" fill="#f7f9fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="760" letter-spacing="-2.8">Built with CloudChef</text>
  <text x="76" y="323" fill="#c9d2dc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="500">Open a shared Cloudflare app project.</text>

